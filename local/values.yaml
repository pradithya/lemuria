# Local deployment values for Lemuria
# This file is used for local development

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

ingress:
  enabled: false

# Non-sensitive config (stored in ConfigMap)
config:
  server:
    port: 4141
    host: "0.0.0.0"
    base_url: "https://lemuria.utilitytools.app"
    log_level: "debug"
  argocd:
    server_url: "https://argocd.utilitytools.app"
    insecure: false
  redis:
    address: "redis://localhost:6379"
    db: 0
  defaults:
    autoplan: true
    require_approval: true
    auto_merge: true
    merge_method: "squash"

# Sensitive config (stored in Secret, merged on top of config above)
secrets:
  create: false
  existingSecret: "lemuria-secrets"

redis:
  master:
    persistence:
      # -- Enable Redis data persistence
      enabled: true
      # -- Size of Redis PVC
      size: 2Gi
    resources:
      limits:
        cpu: 1
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
