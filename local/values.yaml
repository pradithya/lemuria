# Local deployment values for Lemuria
# This file is used for local development

replicaCount: 1

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

ingress:
  enabled: false

# Non-sensitive config (stored in ConfigMap)
config:
  server:
    port: 4141
    host: "0.0.0.0"
    base_url: "https://lemuria.utilitytools.app"
    log_level: "debug"
  argocd:
    server_url: "https://argocd.utilitytools.app"
    insecure: false
  redis:
    address: "lemuria-redis-master:6379"
    db: 0
  defaults:
    autoplan: true
    require_approval: true
    auto_merge: true
    merge_method: "squash"
  auth:
    enabled: true
    session_ttl: "24h"
    cookie_secure: true
    default_role: "user"
    oidc:
      name: "Google"
      issuer_url: "https://accounts.google.com"
      client_id: "440035316190-loflfvahu7nl8eqfvhlgmdopup4fl073.apps.googleusercontent.com"
      scopes:
        - openid
        - email
        - profile
      allowed_domains:
        - "utilitytools.app"

# Sensitive config (stored in Secret, merged on top of config above)
secrets:
  create: false
  existingSecret: "lemuria-secrets"

redis:
  master:
    persistence:
      # -- Enable Redis data persistence
      enabled: true
      # -- Size of Redis PVC
      size: 2Gi
    resources:
      limits:
        cpu: 1
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
