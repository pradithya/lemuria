<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
  <style>
    :root {
      --color-primary: #0969da;
      --color-secondary: #8250df;
      --color-bg: #ffffff;
      --color-bg-secondary: #f6f8fa;
      --color-text: #24292f;
      --color-text-secondary: #57606a;
      --color-border: #d0d7de;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--color-bg);
      color: var(--color-text);
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 2rem 1rem;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    .header p {
      margin: 0.5rem 0 0;
      opacity: 0.9;
    }

    .container {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      min-height: calc(100vh - 200px);
    }

    .sidebar {
      width: 250px;
      background: var(--color-bg-secondary);
      border-right: 1px solid var(--color-border);
      padding: 1.5rem;
      flex-shrink: 0;
    }

    .sidebar nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sidebar nav li {
      margin-bottom: 0.5rem;
    }

    .sidebar nav a {
      display: block;
      padding: 0.5rem 0.75rem;
      color: var(--color-text);
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .sidebar nav a:hover {
      background: var(--color-border);
    }

    .sidebar nav a.active {
      background: var(--color-primary);
      color: white;
    }

    .content {
      flex: 1;
      padding: 2rem;
      max-width: 100%;
      overflow-x: auto;
    }

    .markdown-body {
      max-width: 900px;
    }

    .footer {
      background: var(--color-bg-secondary);
      border-top: 1px solid var(--color-border);
      padding: 1.5rem;
      text-align: center;
      color: var(--color-text-secondary);
      font-size: 0.875rem;
    }

    .footer a {
      color: var(--color-primary);
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
      }

      .sidebar nav ul {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .sidebar nav li {
        margin-bottom: 0;
      }
    }

    /* Code block styling */
    .markdown-body pre {
      background: #f6f8fa;
      border-radius: 6px;
      padding: 1rem;
      overflow-x: auto;
    }

    .markdown-body code {
      background: #f6f8fa;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-size: 0.9em;
    }

    .markdown-body pre code {
      background: transparent;
      padding: 0;
    }

    /* Table styling */
    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 1rem 0;
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--color-border);
      padding: 0.5rem 1rem;
      text-align: left;
    }

    .markdown-body th {
      background: var(--color-bg-secondary);
      font-weight: 600;
    }

    /* Details/summary styling */
    .markdown-body details {
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 0.5rem 1rem;
      margin: 1rem 0;
    }

    .markdown-body summary {
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>{{ site.title }}</h1>
    <p>{{ site.description }}</p>
  </header>

  <div class="container">
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="{{ site.baseurl }}/" {% if page.url == "/" %}class="active"{% endif %}>Home</a></li>
          <li><a href="{{ site.baseurl }}/getting-started" {% if page.url contains "getting-started" %}class="active"{% endif %}>Getting Started</a></li>
          <li><a href="{{ site.baseurl }}/configuration" {% if page.url contains "configuration" %}class="active"{% endif %}>Configuration</a></li>
          <li><a href="{{ site.baseurl }}/authentication" {% if page.url contains "authentication" %}class="active"{% endif %}>Authentication</a></li>
          <li><a href="{{ site.baseurl }}/commands" {% if page.url contains "commands" %}class="active"{% endif %}>Commands</a></li>
          <li><a href="{{ site.baseurl }}/workflow" {% if page.url contains "workflow" %}class="active"{% endif %}>Workflow</a></li>
          <li><a href="{{ site.baseurl }}/troubleshooting" {% if page.url contains "troubleshooting" %}class="active"{% endif %}>Troubleshooting</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <article class="markdown-body">
        {{ content }}
      </article>
    </main>
  </div>

  <footer class="footer">
    <p>
      <a href="https://github.com/org/lemuria">GitHub</a> |
      <a href="https://github.com/org/lemuria/issues">Issues</a> |
      <a href="https://github.com/org/lemuria/blob/main/LICENSE">License</a>
    </p>
    <p>&copy; {{ site.time | date: '%Y' }} Lemuria. Built with Jekyll.</p>
  </footer>
</body>
</html>
