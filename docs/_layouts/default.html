<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root {
      --color-primary: #5865F2;
      --color-primary-dark: #4752c4;
      --color-bg: #ffffff;
      --color-bg-secondary: #f8f9fa;
      --color-bg-code: #f4f4f5;
      --color-text: #1a1a2e;
      --color-text-secondary: #6b7280;
      --color-border: #e5e7eb;
      --color-link: #5865F2;
      --sidebar-width: 260px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--color-text);
      background: var(--color-bg);
    }

    a {
      color: var(--color-link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #5865F2 0%, #7c3aed 100%);
      color: white;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    /* Layout */
    .wrapper {
      display: flex;
      min-height: calc(100vh - 180px);
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--color-bg-secondary);
      border-right: 1px solid var(--color-border);
      padding: 2rem 0;
      flex-shrink: 0;
    }

    .sidebar nav {
      position: sticky;
      top: 2rem;
    }

    .sidebar ul {
      list-style: none;
    }

    .sidebar li {
      margin-bottom: 0.25rem;
    }

    .sidebar a {
      display: block;
      padding: 0.65rem 1.5rem;
      color: var(--color-text);
      font-weight: 500;
      border-left: 3px solid transparent;
      transition: all 0.15s ease;
    }

    .sidebar a:hover {
      background: rgba(88, 101, 242, 0.08);
      color: var(--color-primary);
      text-decoration: none;
      border-left-color: var(--color-primary);
    }

    .sidebar a.active {
      background: rgba(88, 101, 242, 0.12);
      color: var(--color-primary);
      border-left-color: var(--color-primary);
    }

    /* Main Content */
    .main {
      flex: 1;
      padding: 3rem;
      max-width: 900px;
      background: var(--color-bg);
    }

    /* Typography */
    .content h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--color-border);
      color: var(--color-text);
    }

    .content h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      color: var(--color-text);
    }

    .content h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      color: var(--color-text);
    }

    .content h4 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .content p {
      margin-bottom: 1rem;
      color: var(--color-text);
    }

    .content ul, .content ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }

    .content li {
      margin-bottom: 0.5rem;
    }

    .content hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 2rem 0;
    }

    /* Code */
    .content code {
      font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
      font-size: 0.875em;
      background: var(--color-bg-code);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      color: #e83e8c;
    }

    .content pre {
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 1.25rem;
      border-radius: 8px;
      overflow-x: auto;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .content pre code {
      background: transparent;
      padding: 0;
      color: inherit;
      font-size: inherit;
    }

    /* Tables */
    .content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .content th {
      background: var(--color-bg-secondary);
      font-weight: 600;
      text-align: left;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
    }

    .content td {
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
      vertical-align: top;
    }

    .content tr:nth-child(even) {
      background: var(--color-bg-secondary);
    }

    /* Blockquotes */
    .content blockquote {
      border-left: 4px solid var(--color-primary);
      padding: 0.75rem 1rem;
      margin: 1rem 0;
      background: rgba(88, 101, 242, 0.05);
      border-radius: 0 8px 8px 0;
    }

    .content blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Details/Summary */
    .content details {
      background: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem 0;
    }

    .content summary {
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .content details[open] summary {
      margin-bottom: 0.75rem;
    }

    /* Strong/Bold text */
    .content strong {
      font-weight: 600;
      color: var(--color-text);
    }

    /* Footer */
    .footer {
      background: var(--color-bg-secondary);
      border-top: 1px solid var(--color-border);
      padding: 1.5rem 2rem;
      text-align: center;
    }

    .footer p {
      margin: 0.5rem 0;
      color: var(--color-text-secondary);
      font-size: 0.9rem;
    }

    .footer a {
      color: var(--color-text-secondary);
      margin: 0 0.5rem;
    }

    .footer a:hover {
      color: var(--color-primary);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .wrapper {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
        padding: 1rem 0;
      }

      .sidebar nav {
        position: static;
      }

      .sidebar ul {
        display: flex;
        flex-wrap: wrap;
        padding: 0 1rem;
        gap: 0.25rem;
      }

      .sidebar li {
        margin: 0;
      }

      .sidebar a {
        padding: 0.5rem 1rem;
        border-left: none;
        border-radius: 6px;
      }

      .sidebar a:hover,
      .sidebar a.active {
        border-left: none;
      }

      .main {
        padding: 2rem 1.5rem;
      }
    }

    /* Syntax highlighting for code blocks */
    .highlight .c, .highlight .c1, .highlight .cm { color: #6272a4; } /* Comments */
    .highlight .k, .highlight .kd, .highlight .kn { color: #ff79c6; } /* Keywords */
    .highlight .s, .highlight .s1, .highlight .s2 { color: #f1fa8c; } /* Strings */
    .highlight .n, .highlight .nf { color: #50fa7b; } /* Names, functions */
    .highlight .o { color: #ff79c6; } /* Operators */
    .highlight .p { color: #cdd6f4; } /* Punctuation */
    .highlight .m, .highlight .mi { color: #bd93f9; } /* Numbers */
  </style>
</head>
<body>
  <header class="header">
    <h1>{{ site.title }}</h1>
    <p>{{ site.description }}</p>
  </header>

  <div class="wrapper">
    <aside class="sidebar">
      <nav>
        <ul>
          <li><a href="{{ site.baseurl }}/" {% if page.url == "/" %}class="active"{% endif %}>Home</a></li>
          <li><a href="{{ site.baseurl }}/getting-started" {% if page.url contains "getting-started" %}class="active"{% endif %}>Getting Started</a></li>
          <li><a href="{{ site.baseurl }}/configuration" {% if page.url contains "configuration" %}class="active"{% endif %}>Configuration</a></li>
          <li><a href="{{ site.baseurl }}/authentication" {% if page.url contains "authentication" %}class="active"{% endif %}>Authentication</a></li>
          <li><a href="{{ site.baseurl }}/commands" {% if page.url contains "commands" %}class="active"{% endif %}>Commands</a></li>
          <li><a href="{{ site.baseurl }}/workflow" {% if page.url contains "workflow" %}class="active"{% endif %}>Workflow</a></li>
          <li><a href="{{ site.baseurl }}/troubleshooting" {% if page.url contains "troubleshooting" %}class="active"{% endif %}>Troubleshooting</a></li>
        </ul>
      </nav>
    </aside>

    <main class="main">
      <article class="content">
        {{ content }}
      </article>
    </main>
  </div>

  <footer class="footer">
    <p>
      <a href="https://github.com/pradithya/lemuria">GitHub</a> |
      <a href="https://github.com/pradithya/lemuria/issues">Issues</a> |
      <a href="https://github.com/pradithya/lemuria/blob/main/LICENSE">License</a>
    </p>
    <p>&copy; {{ site.time | date: '%Y' }} Lemuria</p>
  </footer>
</body>
</html>
