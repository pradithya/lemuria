apiVersion: apps/v1
kind: Deployment
metadata:
  name: lemuria
  namespace: lemuria
  labels:
    app.kubernetes.io/name: lemuria
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lemuria
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lemuria
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: lemuria
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: lemuria
          image: lemuria:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4141
              protocol: TCP
          env:
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: lemuria-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: lemuria-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: lemuria-secrets
                  key: GITHUB_APP_PRIVATE_KEY
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lemuria-secrets
                  key: ARGOCD_TOKEN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lemuria-secrets
                  key: REDIS_PASSWORD
          args:
            - "-config"
            - "/app/config/lemuria.yaml"
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: lemuria-config
        - name: tmp
          emptyDir: {}
