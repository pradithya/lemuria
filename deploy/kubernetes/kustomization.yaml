apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lemuria

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - redis.yaml
  # Uncomment if you want to use ingress
  # - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: lemuria
  app.kubernetes.io/managed-by: kustomize

images:
  - name: lemuria
    newName: ghcr.io/pradithya/lemuria
    newTag: latest
