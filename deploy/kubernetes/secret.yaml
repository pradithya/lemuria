apiVersion: v1
kind: Secret
metadata:
  name: lemuria-secrets
  namespace: lemuria
  labels:
    app.kubernetes.io/name: lemuria
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # These should be overridden via Kustomize secretGenerator or external secrets manager
  # Placeholder values for structure reference
  GITHUB_WEBHOOK_SECRET: "replace-me"
  GITHUB_APP_ID: "0"
  GITHUB_APP_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    replace-me
    -----END RSA PRIVATE KEY-----
  ARGOCD_TOKEN: "replace-me"
  REDIS_PASSWORD: ""
