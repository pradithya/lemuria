apiVersion: v1
kind: ConfigMap
metadata:
  name: lemuria-config
  namespace: lemuria
  labels:
    app.kubernetes.io/name: lemuria
    app.kubernetes.io/component: config
data:
  lemuria.yaml: |
    server:
      port: 4141
      host: "0.0.0.0"

    redis:
      address: "redis:6379"
      db: 0

    defaults:
      autoplan: true
      require_approval: false
      auto_merge: false
      merge_method: "squash"
