apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lemuria
  namespace: lemuria
  labels:
    app.kubernetes.io/name: lemuria
    app.kubernetes.io/component: ingress
  annotations:
    # Uncomment and configure based on your ingress controller
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
    - host: lemuria.example.com  # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lemuria
                port:
                  name: http
  # Uncomment for TLS
  # tls:
  #   - hosts:
  #       - lemuria.example.com
  #     secretName: lemuria-tls
