suite: configmap tests
templates:
  - configmap.yaml
tests:
  - it: should create a configmap
    asserts:
      - isKind:
          of: ConfigMap
      - isNotEmpty:
          path: data["lemuria.yaml"]

  - it: should contain server configuration
    asserts:
      - matchRegex:
          path: data["lemuria.yaml"]
          pattern: "port: 4141"
      - matchRegex:
          path: data["lemuria.yaml"]
          pattern: "host: 0.0.0.0"

  - it: should contain redis configuration
    asserts:
      - matchRegex:
          path: data["lemuria.yaml"]
          pattern: "redis:"
      - matchRegex:
          path: data["lemuria.yaml"]
          pattern: "db: 0"

  - it: should contain defaults configuration
    asserts:
      - matchRegex:
          path: data["lemuria.yaml"]
          pattern: "autoplan: true"
      - matchRegex:
          path: data["lemuria.yaml"]
          pattern: "require_approval: false"
      - matchRegex:
          path: data["lemuria.yaml"]
          pattern: "merge_method: squash"
