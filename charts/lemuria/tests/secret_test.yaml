suite: secret tests
templates:
  - secret.yaml
tests:
  - it: should not create secret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create secret when enabled
    set:
      secrets:
        create: true
        githubWebhookSecret: "webhook-secret"
        githubAppId: "12345"
        githubAppPrivateKey: "private-key"
        argocdToken: "argocd-token"
        redisPassword: "redis-pass"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - isNotEmpty:
          path: data.GITHUB_WEBHOOK_SECRET
      - isNotEmpty:
          path: data.GITHUB_APP_ID
      - isNotEmpty:
          path: data.GITHUB_APP_PRIVATE_KEY
      - isNotEmpty:
          path: data.ARGOCD_TOKEN
      - isNotEmpty:
          path: data.REDIS_PASSWORD
