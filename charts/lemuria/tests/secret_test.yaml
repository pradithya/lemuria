suite: secret tests
templates:
  - secret.yaml
tests:
  - it: should not create secret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create secret when enabled
    set:
      secrets:
        create: true
        config:
          github:
            webhook_secret: "webhook-secret"
            app_id: 12345
            app_private_key: "private-key"
          argocd:
            token: "argocd-token"
          redis:
            password: "redis-pass"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - isNotEmpty:
          path: stringData["secrets.yaml"]
      - matchRegex:
          path: stringData["secrets.yaml"]
          pattern: "webhook_secret: webhook-secret"
      - matchRegex:
          path: stringData["secrets.yaml"]
          pattern: "app_id: 12345"
      - matchRegex:
          path: stringData["secrets.yaml"]
          pattern: "token: argocd-token"
