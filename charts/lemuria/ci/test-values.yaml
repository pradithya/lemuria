# Values for CI testing
replicaCount: 1

image:
  repository: ghcr.io/argo-atlantis/lemuria
  pullPolicy: Always
  tag: "latest"

serviceAccount:
  create: true
  annotations: {}
  name: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: lemuria.test.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: lemuria-tls
      hosts:
        - lemuria.test.local

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

secrets:
  create: false
  existingSecret: "lemuria-secrets"

redis:
  enabled: true
  persistence:
    enabled: false
