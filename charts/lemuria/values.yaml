# Default values for lemuria.
# This is a YAML-formatted file.

# -- Number of replicas for the lemuria deployment
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/argo-atlantis/lemuria
  # -- Image pull policy
  pullPolicy: Always
  # -- Overrides the image tag whose default is the chart appVersion
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the chart name
nameOverride: ""
# -- Override the full name
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use
  name: ""

# -- Annotations to add to the pod
podAnnotations: {}

# -- Labels to add to the pod
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 80

ingress:
  # -- Enable ingress
  enabled: false
  # -- Ingress class name
  className: nginx
  # -- Ingress annotations
  annotations: {}
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  # -- Ingress hosts configuration
  hosts:
    - host: lemuria.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: lemuria-tls
  #    hosts:
  #      - lemuria.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

# Worker deployment configuration (background job processor)
worker:
  # -- Number of worker replicas
  replicaCount: 1
  # -- Worker resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Lemuria configuration (non-sensitive values stored in ConfigMap)
# Sensitive values are stored in Secret and injected via environment variables
config:
  server:
    # -- Server port
    port: 4141
    # -- Server host
    host: "0.0.0.0"
    # -- Base URL for OAuth callbacks
    base_url: ""
    # -- Log level (debug, info, warn, error)
    log_level: "info"
  argocd:
    # -- ArgoCD server URL (non-sensitive, can be in ConfigMap)
    server_url: ""
    # -- Skip TLS verification
    insecure: false
  redis:
    # -- Redis address
    address: "localhost:6379"
    # -- Redis database number
    db: 0
  queue:
    # -- Enable background job queue
    enabled: false
    # -- Number of concurrent workers
    concurrency: 10
  defaults:
    # -- Enable autoplan on PR
    autoplan: true
    # -- Require approval before sync
    require_approval: false
    # -- Auto merge PR after successful sync
    auto_merge: false
    # -- Merge method (squash, merge, rebase)
    merge_method: "squash"
    # -- Allowed repositories (empty allows all)
    allowed_repos: []

# Secrets configuration (sensitive values stored in Secret)
# This config is merged on top of the base config above
secrets:
  # -- Create secrets (set to false to use existing secrets)
  create: false
  # -- Name of existing secret to use (if create is false)
  existingSecret: "lemuria-secrets"
  # -- Sensitive config values (rendered as YAML in the secret)
  config:
    github:
      webhook_secret: ""
      app_id: 0
      app_private_key: ""
    argocd:
      token: ""
    redis:
      # -- Redis password. Defaults to the Redis subchart password so the app
      # can connect out of the box. Override for production.
      password: "change-me-in-production"

# Redis subchart configuration (Bitnami Redis)
# See https://github.com/bitnami/charts/tree/main/bitnami/redis for all options
redis:
  # -- Enable Redis deployment
  enabled: true
  # -- Redis architecture (standalone or replication)
  architecture: standalone
  image:
    # -- Use official Redis image instead of Bitnami
    repository: redis
    tag: "7"
  auth:
    # -- Enable Redis authentication
    enabled: true
    # -- Default Redis password. Use existingSecret in production.
    password: "change-me-in-production"
  master:
    persistence:
      # -- Enable Redis data persistence
      enabled: false
      # -- Storage class for Redis PVC
      storageClass: ""
      # -- Size of Redis PVC
      size: 1Gi
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
