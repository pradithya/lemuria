apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "lemuria.fullname" . }}-test-connection"
  labels:
    {{- include "lemuria.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "lemuria.fullname" . }}:{{ .Values.service.port }}/health', '-O', '-', '-q', '--timeout=10']
  restartPolicy: Never
