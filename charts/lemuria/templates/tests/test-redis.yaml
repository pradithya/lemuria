{{- if .Values.redis.enabled -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "lemuria.fullname" . }}-test-redis"
  labels:
    {{- include "lemuria.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: redis-client
      image: redis:7-alpine
      command: ['redis-cli']
      args: ['-h', '{{ include "lemuria.fullname" . }}-redis', 'ping']
  restartPolicy: Never
{{- end }}
